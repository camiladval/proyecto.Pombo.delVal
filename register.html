<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link href="./css/style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicio</title>
    </head>
    <body>
         <header class="menu">
            <a href="./index.html" class="logo2">
                <img src="./img/Cali Home Logo.png" alt="logo" class="logo">
            </a>
            <nav class="navheader">
            <ul class="navarriba">
                <li class="listahome"><a class="barra" href="./index.html">Home</a></li>
                <li class="listahome"><a class="barra" href="./login.html">Login</a></li>
                <li class="listahome"><a class="barra" href="./register.html">Registrarse</a></li>
            </ul>
            </nav>
            <form class="forms" action="./search-results.html" method="get">
                <input type="text" placeholder="Buscar productos..." class="formsinput">
                <button type="submit" class="formsbutton">Buscar</button>
            </form>
        </header>
        <main class="mainregistro">
        <section class="seccionregistro">
            <form action="./login.html" method="get" class="formregistro">

                <div>
                    <label for="email" class="labelregistro">Email</label>
                    <input type="email" id="email" name="email" value="" placeholder="Introduce tu email" class="inputregistro">
                </div>

                <div>
                    <label for="contraseña" class="labelregistro">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" value="" placeholder="Introduce tu contraseña" class="inputregistro">
                </div>

                <div>
                    <label for="repetir" class="labelregistro">Repetir contraseña</label>
                    <input type="password" id="repetir" name="repetir" value="" placeholder="Introduce denuevo tu contraseña" class="inputregistro">
                </div>

                <div class="terminos">
                    <input type="checkbox" id="terminos" name="terminos" value="" class="inputterminos">
                    <label for="terminos" class="labelterminos">Acepto términos y condiciones</label>
                </div>

                <button type="submit" class="botonform">Registrarme</button>

                <a href="login.html" class="cuentaexistente">Ya tengo una cuenta</a>

            </form>
        </section>
        </main>
        <footer class="abajo"> 
            
            <p>Camila del Val - Milagros Pombo</p>

        </footer>
    </body>
</html>
