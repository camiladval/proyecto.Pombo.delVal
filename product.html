<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link href="./css/style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Producto</title>
    </head>
    <body>
        <header class="menu">
            <a href="./index.html" class="logo2">
                <img src="./img/CaliHomeLogo.png" alt="logo" class="logo">
            </a>
            <nav class="navheader">
                <ul class="navarriba">
                    <li class="listahome"><a class="barra" href="./index.html">Home</a></li>
                    <li class="listahome"><a class="barra" href="./login.html">Login</a></li>
                    <li class="listahome"><a class="barra" href="./register.html">Registrarse</a></li>
                </ul>
            </nav>
            <form action="./search-results.html" method="get" class="forms">
                <input type="text" name="q" placeholder="Buscar productos..." class="formsinput">
                <button type="submit" class="formsbutton">Buscar</button>
                <p class="obligatorio_errorheader"></p>
            </form>
        </header>

        <main class="contenido">
            <aside class="productosycategoria">
                <h2 class="categorymenu">Categorías</h2>
                <ul class="categorymenu" id="lista-categorias"></ul>
            </aside>

            <div class="contenidoproduct">
                <section>
                    <article class="producto.detalle">
                        <div class="producto.info">
                            <h1 class="titulolampara"></h1>
                            <div class="imagen">
                                <img src="" alt="" class="imagenfija">

                                <div class="caracteristicas_product">
                                    <p class="parrafocaracteristicas marca"></p>
                                    <p class="parrafocaracteristicas descripcion"></p>
                                    <p class="parrafocaracteristicas precio"></p>
                                    <p class="parrafocaracteristicas"><strong>Categoría:</strong> <a class="categoria" href=""></a></p>
                                    <p class="parrafocaracteristicas stock"></p>
                                    <p class="parrafocaracteristicas tags"></p>
                                </div>
                            </div>
                        </div>
                    </article>
                </section>

                <section class="reviews">
                    <h2 class="tituloreviews">Opiniones del producto</h2>
                    <article class="opiniones"></article>
                </section>
            </div>
        </main>

        <footer class="abajo">
            <p>Camila del Val - Milagros Pombo</p>
        </footer>

        <script src="./js/product.js"></script>
        <script src="./js/saludo.js"></script>
        <script src="./js/logout.js"></script>
    </body>
</html>
